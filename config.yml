          title: Dr. Mingyue Zhang

         
          subtitle: "I am a postdoctoral researcher in the group of Prof. Ansgar Jüngel at TU Wien, Austria, since October 2025. I obtained my PhD in July 2025 under the supervision of Prof. Benoît Perthame at the Laboratoire Jacques-Louis Lions.<br><br>My research focuses on the analysis of nonlinear partial differential equations and entropy methods. I am interested in Keller–Segel systems, kinetic equations, the Navier–Stokes equations, and general cross-diffusion systems. My analytical interests include well-posedness, singular limits, and pattern formation.
<br><br>
